<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TeamFlow - Đánh giá nhóm</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:system-ui,sans-serif;background:#f5f4f0;color:#1a1916;padding:20px;}
  .app{max-width:1200px;margin:0 auto;display:flex;gap:24px;}
  .sidebar{width:200px;}
  .main{flex:1;}
  .logo{font-size:20px;font-weight:700;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid #e8e6df;}
  .nav-btn{display:block;width:100%;padding:12px 16px;margin-bottom:6px;border:none;background:white;border-radius:12px;text-align:left;cursor:pointer;font-weight:500;}
  .nav-btn:hover{background:#e8e6df;}
  .nav-btn.active{background:#1a1916;color:white;}
  .card{background:white;border-radius:16px;padding:20px;margin-bottom:20px;border:1px solid #e8e6df;}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  .grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
  .input{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin-top:4px;}
  .btn{padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-weight:600;}
  .btn-primary{background:#1a1916;color:white;}
  .member-row{display:flex;align-items:center;gap:10px;padding:10px;background:#f9f8f5;border-radius:10px;margin-bottom:6px;}
  .task-row{display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid #eee;}
  .stat-card{text-align:center;}
  .stat-value{font-size:32px;font-weight:800;}
  table{width:100%;border-collapse:collapse;}
  th,td{padding:10px;text-align:left;border-bottom:1px solid #eee;}
  .toast{position:fixed;bottom:20px;right:20px;background:#1a1916;color:white;padding:10px 20px;border-radius:20px;z-index:1000;}
  .tag{padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600;display:inline-block;}
  .tag-green{background:#e6f7e6;color:#059669;}
  .tag-amber{background:#fff3e0;color:#d97706;}
  .avatar{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;}
</style>
</head>
<body>
<div id="root"></div>

<script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.2.0",
      "react-dom/client": "https://esm.sh/react-dom@18.2.0/client"
    }
  }
</script>

<script type="module">
  import React from 'react';
  import { createRoot } from 'react-dom/client';
  const { useState, useMemo } = React;
  const h = React.createElement;

  const uid = () => Math.random().toString(36).substring(2, 8);
  const PEER_CRITERIA = ["Chất lượng CV", "Chủ động", "Hợp tác"];
  const LEADER_CRITERIA = ["Trách nhiệm", "Chất lượng", "Phối hợp"];
  const RATING_OPTS = [0,2,6,8,9,10];
  const COLORS = ["#4338ca","#059669","#d97706","#dc2626"];

  const seedMembers = [
    {id:uid(), name:"Nguyễn Văn An", role:"member"},
    {id:uid(), name:"Trần Thị Bình", role:"member"},
    {id:uid(), name:"Lê Hoàng Cường", role:"leader"}
  ];
  const seedTasks = [
    {id:uid(), title:"Thiết kế UI", assignee:seedMembers[0].id, status:"done"},
    {id:uid(), title:"Xây API", assignee:seedMembers[1].id, status:"doing"},
    {id:uid(), title:"Viết báo cáo", assignee:seedMembers[2].id, status:"todo"}
  ];

  const Avatar = ({name, idx}) => {
    const color = COLORS[idx % COLORS.length];
    return h('div', {className:'avatar', style:{background:color+'20', color:color}}, name.charAt(0));
  };
  const Tag = ({color, children}) => h('span', {className:`tag tag-${color}`}, children);

  const Dashboard = ({members, tasks}) => {
    const done = tasks.filter(t=>t.status==='done').length;
    return h('div', null,
      h('h1', {style:{marginBottom:20}}, '📊 Dashboard'),
      h('div', {className:'grid-4'},
        h('div', {className:'stat-card'}, h('div', {className:'stat-value'}, members.length), h('div', null, 'Thành viên')),
        h('div', {className:'stat-card'}, h('div', {className:'stat-value'}, done), h('div', null, 'Hoàn thành')),
        h('div', {className:'stat-card'}, h('div', {className:'stat-value'}, tasks.length), h('div', null, 'Tổng task'))
      )
    );
  };

  const Setup = ({members, setMembers, showToast}) => {
    const [name, setName] = useState('');
    const add = () => {
      if(!name.trim()) return;
      setMembers([...members, {id:uid(), name:name.trim(), role:'member'}]);
      setName('');
      showToast('✅ Đã thêm');
    };
    const remove = (id) => setMembers(members.filter(m=>m.id!==id));
    return h('div', null,
      h('h1', {style:{marginBottom:20}}, '⚙️ Thiết lập'),
      h('div', {className:'card'},
        h('div', {style:{display:'flex', gap:10, marginBottom:16}},
          h('input', {className:'input', placeholder:'Tên thành viên', value:name, onChange:e=>setName(e.target.value)}),
          h('button', {className:'btn btn-primary', onClick:add}, 'Thêm')
        ),
        members.map((m,idx)=>h('div', {key:m.id, className:'member-row'},
          h(Avatar, {name:m.name, idx}),
          h('span', {style:{flex:1}}, m.name),
          h('button', {className:'btn', style:{padding:'4px 8px'}, onClick:()=>remove(m.id)}, 'Xóa')
        ))
      )
    );
  };

  const Tasks = ({members, tasks, setTasks, showToast}) => {
    const [title, setTitle] = useState('');
    const [assignee, setAssignee] = useState('');
    const add = () => {
      if(!title || !assignee) return;
      setTasks([...tasks, {id:uid(), title, assignee, status:'todo'}]);
      setTitle('');
      showToast('✅ Đã thêm');
    };
    const updateStatus = (id, status) => setTasks(tasks.map(t=>t.id===id ? {...t, status} : t));
    return h('div', null,
      h('h1', {style:{marginBottom:20}}, '✅ Task Log'),
      h('div', {className:'card'},
        h('div', {style:{display:'flex', gap:10}},
          h('input', {className:'input', placeholder:'Tên task', value:title, onChange:e=>setTitle(e.target.value)}),
          h('select', {className:'input', value:assignee, onChange:e=>setAssignee(e.target.value)},
            h('option', {value:''}, 'Người làm'), members.map(m=>h('option', {key:m.id, value:m.id}, m.name))
          ),
          h('button', {className:'btn btn-primary', onClick:add}, 'Thêm')
        )
      ),
      tasks.map(t=>{
        const member = members.find(m=>m.id===t.assignee);
        return h('div', {key:t.id, className:'task-row'},
          h('div', null, h('strong', null, t.title), h('div', {style:{fontSize:12, color:'gray'}}, member?.name)),
          h('select', {value:t.status, onChange:e=>updateStatus(t.id, e.target.value)},
            h('option', {value:'todo'}, 'Todo'), h('option', {value:'doing'}, 'Đang làm'), h('option', {value:'done'}, 'Done')
          )
        );
      })
    );
  };

  const Peer = ({members, peerReviews, setPeerReviews, showToast}) => {
    const [reviewer, setReviewer] = useState('');
    const get = (reviewee, ci) => peerReviews?.[reviewer]?.[reviewee]?.[ci] || 0;
    const set = (reviewee, ci, val) => setPeerReviews(prev => ({
      ...prev, [reviewer]: {...prev[reviewer], [reviewee]: {...prev[reviewer]?.[reviewee], [ci]: val}}
    }));
    return h('div', null,
      h('h1', {style:{marginBottom:20}}, '🤝 Peer Review'),
      h('div', {className:'card'},
        h('select', {className:'input', value:reviewer, onChange:e=>setReviewer(e.target.value)},
          h('option', {value:''}, '-- Bạn là ai? --'), members.map(m=>h('option', {key:m.id, value:m.id}, m.name))
        ),
        reviewer && members.filter(m=>m.id!==reviewer).map(reviewee => h('div', {key:reviewee.id, style:{marginTop:16}},
          h('h4', null, 'Đánh giá ', reviewee.name),
          PEER_CRITERIA.map((c,ci)=>h('div', {key:ci, style:{marginTop:8}},
            h('div', {style:{fontSize:12, fontWeight:600}}, c),
            h('select', {className:'input', value:get(reviewee.id, ci), onChange:e=>set(reviewee.id, ci, Number(e.target.value))},
              RATING_OPTS.map(v=>h('option', {key:v, value:v}, v===0?'--':v))
            )
          ))
        )),
        reviewer && h('button', {className:'btn btn-primary', style:{marginTop:16}, onClick:()=>showToast('💾 Đã lưu')}, 'Lưu')
      )
    );
  };

  const Leader = ({members, leaderReviews, setLeaderReviews, showToast}) => {
    const get = (mid, ci) => leaderReviews?.[mid]?.[ci] || 0;
    const set = (mid, ci, val) => setLeaderReviews(prev => ({...prev, [mid]: {...prev[mid], [ci]: val}}));
    return h('div', null,
      h('h1', {style:{marginBottom:20}}, '👑 Leader Review'),
      h('div', {className:'card'},
        members.map(m => h('div', {key:m.id, style:{marginBottom:16}},
          h('h4', null, m.name),
          LEADER_CRITERIA.map((c,ci)=>h('div', {key:ci, style:{marginTop:8}},
            h('div', {style:{fontSize:12, fontWeight:600}}, c),
            h('select', {className:'input', value:get(m.id, ci), onChange:e=>set(m.id, ci, Number(e.target.value))},
              RATING_OPTS.map(v=>h('option', {key:v, value:v}, v===0?'--':v))
            )
          ))
        )),
        h('button', {className:'btn btn-primary', onClick:()=>showToast('💾 Đã lưu')}, 'Lưu tất cả')
      )
    );
  };

  const Result = ({members, tasks, peerReviews, leaderReviews}) => {
    const results = useMemo(() => members.map(m => {
      const myTasks = tasks.filter(t=>t.assignee===m.id);
      const doneTasks = myTasks.filter(t=>t.status==='done');
      const taskScore = myTasks.length ? (doneTasks.length/myTasks.length)*10 : 0;
      
      let peerSum=0, peerCnt=0;
      members.forEach(r => {
        if(r.id === m.id) return;
        PEER_CRITERIA.forEach((_,ci) => {
          const v = peerReviews?.[r.id]?.[m.id]?.[ci];
          if(v>0) { peerSum+=v; peerCnt++; }
        });
      });
      const peerScore = peerCnt ? peerSum/peerCnt : 0;
      
      let leaderSum=0, leaderCnt=0;
      LEADER_CRITERIA.forEach((_,ci) => {
        const v = leaderReviews?.[m.id]?.[ci];
        if(v>0) { leaderSum+=v; leaderCnt++; }
      });
      const leaderScore = leaderCnt ? leaderSum/leaderCnt : 0;
      
      const final = (taskScore * 0.4) + (peerScore * 0.4) + (leaderScore * 0.2);
      return {...m, taskScore: taskScore.toFixed(1), peerScore: peerScore.toFixed(1), leaderScore: leaderScore.toFixed(1), final: final.toFixed(2)};
    }).sort((a,b)=>b.final - a.final), [members,tasks,peerReviews,leaderReviews]);
    
    return h('div', null,
      h('h1', {style:{marginBottom:20}}, '🏆 Kết quả'),
      h('div', {className:'card'},
        h('div', {style:{background:'#f0efe9', padding:10, borderRadius:8, marginBottom:16}}, '📐 Công thức: Task 40% + Peer 40% + Leader 20%'),
        h('table', null,
          h('thead', null, h('tr', null, h('th', '#'), h('th', 'Thành viên'), h('th', 'Task'), h('th', 'Peer'), h('th', 'Leader'), h('th', 'Tổng'))),
          h('tbody', null, results.map((r,i)=>h('tr', {key:r.id},
            h('td', i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1),
            h('td', r.name),
            h('td', r.taskScore),
            h('td', r.peerScore),
            h('td', r.leaderScore),
            h('td', {style:{fontWeight:'bold'}}, r.final)
          )))
        )
      )
    );
  };

  const App = () => {
    const [page, setPage] = useState('dashboard');
    const [members, setMembers] = useState(seedMembers);
    const [tasks, setTasks] = useState(seedTasks);
    const [peerReviews, setPeerReviews] = useState({});
    const [leaderReviews, setLeaderReviews] = useState({});
    const [toast, setToast] = useState(null);
    const showToast = (msg) => { setToast(msg); setTimeout(()=>setToast(null), 2000); };
    
    const pages = {
      dashboard: h(Dashboard, {members, tasks}),
      setup: h(Setup, {members, setMembers, showToast}),
      tasks: h(Tasks, {members, tasks, setTasks, showToast}),
      peer: h(Peer, {members, peerReviews, setPeerReviews, showToast}),
      leader: h(Leader, {members, leaderReviews, setLeaderReviews, showToast}),
      result: h(Result, {members, tasks, peerReviews, leaderReviews})
    };
    
    const nav = [
      {id:'dashboard', label:'📊 Dashboard'},
      {id:'setup', label:'⚙️ Thiết lập'},
      {id:'tasks', label:'✅ Task Log'},
      {id:'peer', label:'🤝 Peer Review'},
      {id:'leader', label:'👑 Leader'},
      {id:'result', label:'🏆 Kết quả'}
    ];
    
    return h('div', {className:'app'},
      h('div', {className:'sidebar'},
        h('div', {className:'logo'}, '🎯 TeamFlow'),
        nav.map(item => h('button', {key:item.id, className:`nav-btn ${page===item.id ? 'active' : ''}`, onClick:()=>setPage(item.id)}, item.label))
      ),
      h('div', {className:'main'}, pages[page]),
      toast && h('div', {className:'toast'}, toast)
    );
  };

  const root = createRoot(document.getElementById('root'));
  root.render(h(App, null));
</script>
</body>
</html>
