<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>TeamFlow - Đánh giá nhóm</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:system-ui,sans-serif;background:#f5f4f0;color:#1a1916;padding:20px;}
  .app{max-width:1200px;margin:0 auto;}
  .sidebar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid #e8e6df;}
  .nav-btn{padding:10px 20px;border:none;background:white;border-radius:12px;cursor:pointer;font-weight:600;color:#6b6860;box-shadow:0 1px 2px rgba(0,0,0,0.05);}
  .nav-btn.active{background:#1a1916;color:white;}
  .card{background:white;border-radius:16px;padding:20px;margin-bottom:20px;border:1px solid #e8e6df;}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  .input{width:100%;padding:10px 12px;border:1px solid #d8d5cc;border-radius:10px;margin-top:4px;}
  .btn{padding:8px 16px;border-radius:10px;border:none;cursor:pointer;font-weight:600;}
  .btn-primary{background:#1a1916;color:white;}
  .btn-ghost{background:#f0efe9;color:#1a1916;}
  .member-item{display:flex;align-items:center;gap:12px;padding:10px;background:#f9f8f5;border-radius:12px;margin-bottom:8px;}
  .tag{padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600;}
  .tag-green{background:#e6f7e6;color:#059669;}
  .tag-amber{background:#fff3e0;color:#d97706;}
  .task-item{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid #e8e6df;}
  table{width:100%;border-collapse:collapse;}
  th,td{padding:10px;text-align:left;border-bottom:1px solid #e8e6df;}
  .toast{position:fixed;bottom:20px;right:20px;background:#1a1916;color:white;padding:12px 20px;border-radius:12px;}
</style>
</head>
<body>
<div id="root"></div>

<script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18",
      "react-dom/client": "https://esm.sh/react-dom@18/client"
    }
  }
</script>

<script type="module">
  import React from 'react';
  import { createRoot } from 'react-dom/client';
  const { useState, useEffect, useMemo } = React;
  const h = React.createElement;

  // ========== CONSTANTS ==========
  const uid = () => Math.random().toString(36).substring(2, 8);
  const COMPLEXITY = {1:{label:"Nhẹ",pts:1}, 2:{label:"TB",pts:2}, 3:{label:"Nặng",pts:3}};
  const PEER_CRITERIA = ["Chất lượng CV", "Chủ động", "Hợp tác"];
  const LEADER_CRITERIA = ["Trách nhiệm", "Chất lượng", "Phối hợp"];
  const RATING_OPTS = [0,2,6,8,9,10];
  const MEMBER_COLORS = ["#4338ca","#059669","#d97706","#dc2626","#7c3aed"];

  // ========== SEED DATA ==========
  const seedMembers = [
    {id:uid(), name:"Nguyễn Văn A", role:"member"},
    {id:uid(), name:"Trần Thị B", role:"member"},
    {id:uid(), name:"Lê Văn C", role:"leader"}
  ];
  const seedTasks = [
    {id:uid(), title:"Thiết kế UI", assignee:seedMembers[0].id, complexity:2, status:"done", deadline:"2026-06-10"},
    {id:uid(), title:"Xây API", assignee:seedMembers[1].id, complexity:3, status:"doing", deadline:"2026-06-15"},
    {id:uid(), title:"Viết báo cáo", assignee:seedMembers[2].id, complexity:1, status:"todo", deadline:"2026-06-18"}
  ];

  // ========== COMPONENTS ==========
  const Avatar = ({name, idx}) => {
    const color = MEMBER_COLORS[idx % MEMBER_COLORS.length];
    return h('div', {style:{width:32,height:32,borderRadius:10,background:color+'20',color:color,display:'flex',alignItems:'center',justifyContent:'center',fontWeight:700}}, name.charAt(0));
  };

  const Tag = ({color, children}) => h('span', {className:`tag tag-${color}`}, children);

  // ========== PAGES ==========
  const Dashboard = ({members, tasks}) => {
    const done = tasks.filter(t=>t.status==='done').length;
    return h('div', null,
      h('h1', {style:{marginBottom:20}}, '📊 Dashboard'),
      h('div', {className:'grid-3'},
        h('div', {className:'card'}, h('h3', null, '👥 Thành viên'), h('p', {style:{fontSize:32,fontWeight:'bold'}}, members.length)),
        h('div', {className:'card'}, h('h3', null, '✅ Hoàn thành'), h('p', {style:{fontSize:32,fontWeight:'bold'}}, done)),
        h('div', {className:'card'}, h('h3', null, '📋 Tổng task'), h('p', {style:{fontSize:32,fontWeight:'bold'}}, tasks.length))
      )
    );
  };

  const Setup = ({members, setMembers, showToast}) => {
    const [name, setName] = useState('');
    const add = () => {
      if(!name.trim()) return;
      setMembers([...members, {id:uid(), name:name.trim(), role:'member'}]);
      setName('');
      showToast('✅ Đã thêm thành viên');
    };
    const remove = (id) => setMembers(members.filter(m=>m.id!==id));
    return h('div', null,
      h('h1', {style:{marginBottom:20}}, '⚙️ Thiết lập'),
      h('div', {className:'card'},
        h('div', {style:{display:'flex', gap:10}},
          h('input', {className:'input', placeholder:'Tên thành viên', value:name, onChange:e=>setName(e.target.value)}),
          h('button', {className:'btn btn-primary', onClick:add}, 'Thêm')
        ),
        h('div', {style:{marginTop:16}}, members.map((m,idx)=>h('div', {key:m.id, className:'member-item'},
          h(Avatar, {name:m.name, idx}),
          h('span', {style:{flex:1}}, m.name),
          h('span', {className:`tag tag-${m.role==='leader'?'amber':'green'}`}, m.role),
          h('button', {className:'btn btn-ghost', style:{padding:'4px 12px'}, onClick:()=>remove(m.id)}, 'Xóa')
        )))
      )
    );
  };

  const Tasks = ({members, tasks, setTasks, showToast}) => {
    const [form, setForm] = useState({title:'', assignee:'', complexity:1});
    const add = () => {
      if(!form.title || !form.assignee) return;
      setTasks([...tasks, {...form, id:uid(), status:'todo'}]);
      setForm({title:'', assignee:'', complexity:1});
      showToast('✅ Đã thêm task');
    };
    const updateStatus = (id, status) => setTasks(tasks.map(t=>t.id===id ? {...t, status} : t));
    return h('div', null,
      h('h1', {style:{marginBottom:20}}, '✅ Task Log'),
      h('div', {className:'card'},
        h('div', {className:'grid-2', style:{gap:10, marginBottom:12}},
          h('input', {className:'input', placeholder:'Tiêu đề', value:form.title, onChange:e=>setForm({...form, title:e.target.value})}),
          h('select', {className:'input', value:form.assignee, onChange:e=>setForm({...form, assignee:e.target.value})},
            h('option', {value:''}, 'Người thực hiện'), members.map(m=>h('option', {key:m.id, value:m.id}, m.name))
          ),
          h('select', {className:'input', value:form.complexity, onChange:e=>setForm({...form, complexity:Number(e.target.value)})},
            h('option', {value:1}, 'Nhẹ'), h('option', {value:2}, 'TB'), h('option', {value:3}, 'Nặng')
          )
        ),
        h('button', {className:'btn btn-primary', onClick:add}, '+ Thêm task')
      ),
      h('div', {className:'card'}, tasks.map(t=>{
        const member = members.find(m=>m.id===t.assignee);
        return h('div', {key:t.id, className:'task-item'},
          h('div', null, h('div', {style:{fontWeight:600}}, t.title), h('div', {style:{fontSize:12,color:'#6b6860'}}, member?.name)),
          h('select', {className:'input', style:{width:100}, value:t.status, onChange:e=>updateStatus(t.id, e.target.value)},
            h('option', {value:'todo'}, 'Todo'), h('option', {value:'doing'}, 'Đang làm'), h('option', {value:'done'}, 'Done')
          )
        );
      }))
    );
  };

  const Peer = ({members, peerReviews, setPeerReviews, showToast}) => {
    const [reviewer, setReviewer] = useState('');
    const get = (reviewee, ci) => peerReviews?.[reviewer]?.[reviewee]?.[ci] || 0;
    const set = (reviewee, ci, val) => setPeerReviews(prev => ({
      ...prev, [reviewer]: {...prev[reviewer], [reviewee]: {...prev[reviewer]?.[reviewee], [ci]: val}}
    }));
    return h('div', null,
      h('h1', {style:{marginBottom:20}}, '🤝 Peer Review'),
      h('div', {className:'card'},
        h('select', {className:'input', value:reviewer, onChange:e=>setReviewer(e.target.value)},
          h('option', {value:''}, '-- Bạn là ai? --'), members.map(m=>h('option', {key:m.id, value:m.id}, m.name))
        ),
        reviewer && members.filter(m=>m.id!==reviewer).map(reviewee => h('div', {key:reviewee.id, style:{marginTop:16}},
          h('h4', null, 'Đánh giá ', reviewee.name),
          PEER_CRITERIA.map((c,ci)=>h('div', {key:ci, style:{marginTop:8}},
            h('div', {style:{fontSize:12, fontWeight:600, marginBottom:4}}, c),
            h('select', {className:'input', value:get(reviewee.id, ci), onChange:e=>set(reviewee.id, ci, Number(e.target.value))},
              RATING_OPTS.map(v=>h('option', {key:v, value:v}, v===0?'--':v))
            )
          ))
        ))),
        reviewer && h('button', {className:'btn btn-primary', style:{marginTop:16}, onClick:()=>showToast('💾 Đã lưu peer review')}, 'Lưu đánh giá')
      )
    );
  };

  const Leader = ({members, leaderReviews, setLeaderReviews, showToast}) => {
    const get = (mid, ci) => leaderReviews?.[mid]?.[ci] || 0;
    const set = (mid, ci, val) => setLeaderReviews(prev => ({...prev, [mid]: {...prev[mid], [ci]: val}}));
    return h('div', null,
      h('h1', {style:{marginBottom:20}}, '👑 Leader Review'),
      h('div', {className:'card'},
        members.map(m => h('div', {key:m.id, style:{marginBottom:16}},
          h('h4', null, m.name),
          LEADER_CRITERIA.map((c,ci)=>h('div', {key:ci, style:{marginTop:8}},
            h('div', {style:{fontSize:12, fontWeight:600}}, c),
            h('select', {className:'input', value:get(m.id,ci), onChange:e=>set(m.id, ci, Number(e.target.value))},
              RATING_OPTS.map(v=>h('option', {key:v, value:v}, v===0?'--':v))
            )
          ))
        )),
        h('button', {className:'btn btn-primary', onClick:()=>showToast('💾 Đã lưu leader review')}, 'Lưu tất cả')
      )
    );
  };

  const Result = ({members, tasks, peerReviews, leaderReviews}) => {
    const results = useMemo(() => members.map(m => {
      const myTasks = tasks.filter(t=>t.assignee===m.id);
      const doneTasks = myTasks.filter(t=>t.status==='done');
      const totalPts = myTasks.reduce((a,t)=>a+COMPLEXITY[t.complexity].pts, 0);
      const earnedPts = doneTasks.reduce((a,t)=>a+COMPLEXITY[t.complexity].pts, 0);
      const taskScore = totalPts > 0 ? (earnedPts/totalPts)*10 : 0;
      
      let peerSum=0, peerCnt=0;
      members.forEach(r => {
        if(r.id === m.id) return;
        PEER_CRITERIA.forEach((_,ci) => {
          const v = peerReviews?.[r.id]?.[m.id]?.[ci];
          if(v>0) { peerSum+=v; peerCnt++; }
        });
      });
      const peerScore = peerCnt ? peerSum/peerCnt : 0;
      
      let leaderSum=0, leaderCnt=0;
      LEADER_CRITERIA.forEach((_,ci) => {
        const v = leaderReviews?.[m.id]?.[ci];
        if(v>0) { leaderSum+=v; leaderCnt++; }
      });
      const leaderScore = leaderCnt ? leaderSum/leaderCnt : 0;
      
      // Công thức: Task 40%, Peer 40%, Leader 20%
      const final = (taskScore * 0.4) + (peerScore * 0.4) + (leaderScore * 0.2);
      return {...m, taskScore: taskScore.toFixed(1), peerScore: peerScore.toFixed(1), leaderScore: leaderScore.toFixed(1), final: final.toFixed(2)};
    }).sort((a,b)=>b.final - a.final), [members,tasks,peerReviews,leaderReviews]);
    
    return h('div', null,
      h('h1', {style:{marginBottom:20}}, '🏆 Kết quả'),
      h('div', {className:'card'},
        h('div', {style:{background:'#f0efe9', padding:12, borderRadius:12, marginBottom:16}},
          '📐 ', h('strong', null, 'Công thức:'), ' Thành viên = Task×40% + Peer×40% + Leader×20%'
        ),
        h('table', null,
          h('thead', null, h('tr', null, h('th', '#'), h('th', 'Thành viên'), h('th', 'Task(40%)'), h('th', 'Peer(40%)'), h('th', 'Leader(20%)'), h('th', 'Tổng'))),
          h('tbody', null, results.map((r,i)=>h('tr', {key:r.id},
            h('td', i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1),
            h('td', r.name),
            h('td', r.taskScore),
            h('td', r.peerScore),
            h('td', r.leaderScore),
            h('td', {style:{fontWeight:'bold', color:i===0?'#059669':'#1a1916'}}, r.final)
          )))
        )
      )
    );
  };

  // ========== MAIN APP ==========
  const App = () => {
    const [page, setPage] = useState('dashboard');
    const [members, setMembers] = useState(seedMembers);
    const [tasks, setTasks] = useState(seedTasks);
    const [peerReviews, setPeerReviews] = useState({});
    const [leaderReviews, setLeaderReviews] = useState({});
    const [toast, setToast] = useState(null);
    
    const showToast = (msg) => { setToast(msg); setTimeout(()=>setToast(null), 2000); };
    
    const pages = {
      dashboard: h(Dashboard, {members, tasks}),
      setup: h(Setup, {members, setMembers, showToast}),
      tasks: h(Tasks, {members, tasks, setTasks, showToast}),
      peer: h(Peer, {members, peerReviews, setPeerReviews, showToast}),
      leader: h(Leader, {members, leaderReviews, setLeaderReviews, showToast}),
      result: h(Result, {members, tasks, peerReviews, leaderReviews})
    };
    
    const navItems = [
      {id:'dashboard', label:'📊 Dashboard'},
      {id:'setup', label:'⚙️ Thiết lập'},
      {id:'tasks', label:'✅ Task Log'},
      {id:'peer', label:'🤝 Peer Review'},
      {id:'leader', label:'👑 Leader'},
      {id:'result', label:'🏆 Kết quả'}
    ];
    
    return h('div', {className:'app'},
      h('div', {className:'sidebar'},
        h('div', {style:{fontSize:20, fontWeight:'bold', marginBottom:16, paddingBottom:12, borderBottom:'1px solid #e8e6df'}}, 'TeamFlow'),
        navItems.map(item => h('button', {
          key:item.id,
          className:`nav-btn ${page===item.id?'active':''}`,
          onClick:()=>setPage(item.id)
        }, item.label))
      ),
      h('div', {className:'main'}, pages[page]),
      toast && h('div', {className:'toast'}, toast)
    );
  };

  const root = createRoot(document.getElementById('root'));
  root.render(h(App, null));
</script>
</body>
</html>
